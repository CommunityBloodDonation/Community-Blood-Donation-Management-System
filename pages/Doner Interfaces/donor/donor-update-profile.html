
<form id="updateForm" class="profile-form">

    <div class="form-grid">

        <div class="form-group">
            <label for="donorName">Full Name</label>
            <input type="text" id="donorName" name="name"
                   placeholder="Enter your full name" required>
        </div>

        <div class="form-group">
            <label for="donorEmail">Email Address</label>
            <input type="email" id="donorEmail" name="email"
                   placeholder="Enter your email" required>
        </div>

        <div class="form-group">
            <label for="donorPhone">Phone Number</label>
            <input type="tel" id="donorPhone" name="phone"
                   placeholder="Enter your phone number" required>
        </div>

        <div class="form-group">
            <label for="donorBloodGroup">Blood Group</label>
            <select id="donorBloodGroup" name="bloodGroup" required>
                <option value="">Select blood group</option>
                <option value="A+">A+</option>
                <option value="A-">A-</option>
                <option value="B+">B+</option>
                <option value="B-">B-</option>
                <option value="AB+">AB+</option>
                <option value="AB-">AB-</option>
                <option value="O+">O+</option>
                <option value="O-">O-</option>
            </select>
        </div>

        <div class="form-group">
            <label for="donorDob">Date of Birth</label>
            <input type="date" id="donorDob" name="dob">
        </div>

        <div class="form-group">
            <label for="donorGender">Gender</label>
            <select id="donorGender" name="gender">
                <option value="">Select gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
                <option value="Prefer not to say">Prefer not to say</option>
            </select>
        </div>

        <div class="form-group">
            <label for="donorCity">City</label>
            <input type="text" id="donorCity" name="city"
                   placeholder="Enter your city">
        </div>

        <div class="form-group">
            <label for="donorAddress">Address</label>
            <input type="text" id="donorAddress" name="address"
                   placeholder="Enter your address">
        </div>

        <div class="form-group">
            <label for="donorLastDonation">Last Donation Date</label>
            <input type="date" id="donorLastDonation" name="lastDonation">
        </div>

    </div>

    <p class="form-note">
        🔴 Make sure your information is accurate. Blood group and eligibility
        should be confirmed by an authorized healthcare professional.
    </p>

    <div class="modal-actions">
        <button type="submit" class="primary-btn">Save Changes</button>
        <button type="button" class="secondary-btn" id="cancelUpdate">Cancel</button>
    </div>
</form>
