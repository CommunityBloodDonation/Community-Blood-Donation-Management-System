<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Donor Profile</title>

    <link rel="stylesheet" href="donor-update.css">
</head>

<body>

<!-- Profile Update Popup -->
<div class="profile-overlay" id="profilePopup">

    <div class="profile-popup">

        <!-- Header -->
        <div class="popup-header">
            <div>
                <span class="popup-label">DONOR ACCOUNT</span>
                <h2>Update Profile</h2>
                <p>Update your personal information.</p>
            </div>

            <button class="close-btn" id="closePopup">&times;</button>
        </div>


        <!-- Profile Icon -->
        <div class="profile-photo">
            <div class="profile-icon">👤</div>
            <span>Donor Profile</span>
        </div>


        <!-- Form -->
        <form id="donorProfileForm">

            <div class="form-grid">

                <div class="form-group">
                    <label>Full Name</label>
                    <input
                        type="text"
                        id="fullName"
                        placeholder="Enter your full name"
                        required>
                </div>

                <div class="form-group">
                    <label>Email Address</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required>
                </div>

                <div class="form-group">
                    <label>Phone Number</label>
                    <input
                        type="tel"
                        id="phone"
                        placeholder="Enter your phone number"
                        required>
                </div>

                <div class="form-group">
                    <label>Blood Group</label>

                    <select id="bloodGroup" required>
                        <option value="">Select blood group</option>
                        <option value="A+">A+</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B-">B-</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>
                        <option value="O+">O+</option>
                        <option value="O-">O-</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Date of Birth</label>
                    <input
                        type="date"
                        id="dob"
                        required>
                </div>

                <div class="form-group">
                    <label>City</label>
                    <input
                        type="text"
                        id="city"
                        placeholder="Enter your city"
                        required>
                </div>

            </div>


            <!-- Address -->
            <div class="form-group full">
                <label>Address</label>

                <textarea
                    id="address"
                    rows="3"
                    placeholder="Enter your address"
                    required></textarea>
            </div>


            <!-- Password -->
            <div class="password-section">

                <h3>Change Password</h3>

                <p>Leave these fields empty if you don't want to change your password.</p>

                <div class="form-grid">

                    <div class="form-group">
                        <label>New Password</label>

                        <input
                            type="password"
                            id="newPassword"
                            placeholder="Enter new password">
                    </div>

                    <div class="form-group">
                        <label>Confirm Password</label>

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm new password">
                    </div>

                </div>

            </div>


            <!-- Buttons -->
            <div class="form-buttons">

                <button
                    type="button"
                    class="cancel-btn"
                    id="cancelBtn">
                    Cancel
                </button>

                <button
                    type="submit"
                    class="save-btn">
                    Save Changes
                </button>

            </div>

        </form>

    </div>

</div>


<script src="donor-update.js"></script>

</body>
</html>
