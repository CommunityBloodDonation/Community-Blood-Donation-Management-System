<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        BloodConnect | Update Hospital Profile
    </title>

</head>


<body>


<div class="popup-page-content">


    <!-- ==================================================
         UPDATE PROFILE HEADER
    ================================================== -->

    <div class="profile-page-header">

        <div class="modal-avatar">
            🏥
        </div>


        <div>

            <h2>
                Update Hospital Profile
            </h2>

            <p>
                Keep your hospital information
                accurate and up to date.
            </p>

        </div>

    </div>



    <div class="information-status">

        <span>✓</span>

        Hospital Account

    </div>



    <!-- ==================================================
         UPDATE FORM
    ================================================== -->

    <form id="updateForm">


        <div class="form-grid">


            <!-- HOSPITAL NAME -->

            <div class="form-group">

                <label for="hospitalName">
                    Hospital Name
                </label>

                <input
                    type="text"
                    id="hospitalName"
                    required>

            </div>



            <!-- EMAIL -->

            <div class="form-group">

                <label for="hospitalEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="hospitalEmail"
                    required>

            </div>



            <!-- PHONE -->

            <div class="form-group">

                <label for="hospitalPhone">
                    Phone
                </label>

                <input
                    type="tel"
                    id="hospitalPhone"
                    required>

            </div>



            <!-- LOCATION -->

            <div class="form-group">

                <label for="hospitalLocation">
                    Location
                </label>

                <input
                    type="text"
                    id="hospitalLocation"
                    required>

            </div>



            <!-- REGISTRATION -->

            <div class="form-group">

                <label for="registrationNumber">
                    Registration Number
                </label>

                <input
                    type="text"
                    id="registrationNumber"
                    required>

            </div>



            <!-- TYPE -->

            <div class="form-group">

                <label for="hospitalType">
                    Hospital Type
                </label>

                <select id="hospitalType">

                    <option value="General Hospital">
                        General Hospital
                    </option>

                    <option value="Teaching Hospital">
                        Teaching Hospital
                    </option>

                    <option value="District Hospital">
                        District Hospital
                    </option>

                    <option value="Private Hospital">
                        Private Hospital
                    </option>

                    <option value="Specialized Hospital">
                        Specialized Hospital
                    </option>

                </select>

            </div>



            <!-- ADDRESS -->

            <div class="form-group full">

                <label for="hospitalAddress">
                    Address
                </label>

                <textarea
                    id="hospitalAddress"
                    rows="3"
                    required></textarea>

            </div>



            <!-- BLOOD BANK -->

            <div class="form-group">

                <label for="bloodBank">
                    Blood Bank
                </label>

                <select id="bloodBank">

                    <option value="Available">
                        Available
                    </option>

                    <option value="Not Available">
                        Not Available
                    </option>

                </select>

            </div>



            <!-- EMERGENCY -->

            <div class="form-group">

                <label for="emergencyContact">
                    Emergency Contact
                </label>

                <input
                    type="tel"
                    id="emergencyContact"
                    required>

            </div>


        </div>



        <!-- ==================================================
             FORM BUTTONS
        ================================================== -->

        <div class="page-form-actions">

            <button
                type="button"
                class="cancel-btn"
                id="cancelUpdate">

                Cancel

            </button>


            <button
                type="submit"
                class="primary-btn">

                Save Changes

            </button>

        </div>


    </form>


</div>


</body>

</html>
