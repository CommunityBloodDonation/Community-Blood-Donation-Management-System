<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password - Community Blood Donation Network</title>

    <link rel="stylesheet" href="forget-password.css">
</head>

<body>

    <div class="auth-card">

        <!-- Header -->
        <div class="card-header">
            <h3>COMMUNITY BLOOD DONATION NETWORK</h3>
            <p>Password Recovery</p>
        </div>

        <!-- Icon -->
        <div class="recovery-icon">
            🔐
        </div>

        <!-- Content -->
        <div class="form-container">

            <h2>Forgot Your Password?</h2>

            <p class="description">
                Don't worry. Enter the email address associated with your
                account and we'll send you a password reset link.
            </p>

            <!-- Forgot Password Form -->
            <form id="forgotPasswordForm" onsubmit="handleForgotPassword(event)">

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        class="form-input"
                        placeholder="user@example.com"
                        required
                    >

                </div>

                <button onclick="window.location.href='../Forget-password/otp-verification.html'" class="btn-submit">
                    Send Reset Link
                </button>

            </form>

           <!-- Back to Login -->
            <div class="back-login">
            <a href="../Login/login.html">← Back to Login
            </a>
            </div>

        </div>

    </div>


    <script>

        function handleForgotPassword(event) {

            event.preventDefault();

            const email = document.getElementById("email").value;

            alert(
                "Password reset link has been sent to " + email
            );

        }

    </script>

</body>

</html>
