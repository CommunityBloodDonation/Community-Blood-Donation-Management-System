<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password - Community Blood Donation Network</title>

    <link rel="stylesheet" href="forget-password.css">
</head>

<body>

    <div class="auth-card">

        <!-- Header -->
        <div class="card-header">
            <h3>COMMUNITY BLOOD DONATION NETWORK</h3>
            <p>Password Recovery</p>
        </div>

        <!-- Icon -->
        <div class="recovery-icon">
            🔐
        </div>

        <!-- Content -->
        <div class="form-container">

            <h2>Forgot Your Password?</h2>

            <p class="description">
                Don't worry. Enter the email address associated with your
                account and we'll send you a password reset link.
            </p>

            <!-- Forgot Password Form -->
            <form id="forgotPasswordForm" onsubmit="handleForgotPassword(event)">

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        class="form-input"
                        placeholder="user@example.com"
                        required
                    >

                </div>

                <button type="submit" class="btn-submit">
                    Send Reset Link
                </button>

            </form>

           <!-- Back to Login -->
            <div class="back-login">
            <a href="../Login/login.html">← Back to Login
            </a>
            </div>

        </div>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabaseClient = window.supabase.createClient(
            "https://ayrcawqhhgpmllwvkjjr.supabase.co",
            "sb_publishable_XNMDU8mTvE42rJ4LOwkKKA_tcTopl1-"
        );
        async function handleForgotPassword(event) {
            event.preventDefault();
            const button = event.currentTarget.querySelector("button[type=submit]");
            button.disabled = true;
            button.textContent = "Sending…";
            try {
                const email = document.getElementById("email").value.trim();
                const redirectTo = new URL("reset-password/reset-password.html", window.location.href).href;
                const { error } = await supabaseClient.auth.resetPasswordForEmail(email, { redirectTo });
                if (error) throw error;
                alert("If an account exists for that email, Supabase will send a password reset link.");
            } catch (error) {
                alert("Unable to send the reset email: " + error.message);
            } finally {
                button.disabled = false;
                button.textContent = "Send Reset Link";
            }
        }
    </script>

</body>

</html>
