<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Blood Donation System - Portal</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <div class="auth-card">


        <!-- ==================================================
             HEADER
        =================================================== -->

        <div class="card-header">

            <h3>
                COMMUNITY BLOOD DONATION NETWORK
            </h3>

            <div class="logo">
            <img src="../../Assets/images/logo.png" height="50">
            </div>

        </div>



        <!-- ==================================================
             PORTAL MODE
        =================================================== -->

        <div class="mode-toggle-container">


            <div class="mode-grid">

                <button
                    type="button"
                    id="mode-donor-btn"
                    onclick="setMode('donor')"
                    class="btn-mode active"
                >
                    Donor
                </button>


                <button
                    type="button"
                    id="mode-staff-btn"
                    onclick="setMode('staff')"
                    class="btn-mode inactive"
                >
                    Hospital Staff
                </button>

            </div>

        </div>



        <!-- ==================================================
             AUTH TABS
        =================================================== -->

        <div class="auth-tabs">

            <button
                type="button"
                id="tab-login"
                onclick="switchAuthTab('login')"
                class="tab-btn active"
            >
                Login
            </button>


            <button
                type="button"
                id="tab-register"
                onclick="switchAuthTab('register')"
                class="tab-btn inactive"
            >
                Register
            </button>

        </div>



        <!-- ==================================================
             FORMS
        =================================================== -->

        <div class="form-container">



            <!-- =================================================
                 DONOR LOGIN
            ================================================== -->

            <form
                id="donor-login"
                onsubmit="handleAuth(event, 'Donor Login')"
            >

                <div class="portal-title">
                    Donor Login
                </div>


                <div class="form-group">

                    <label for="donorLoginEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="donorLoginEmail"
                        class="form-input"
                        placeholder="donor@example.com"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="donorLoginPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="donorLoginPassword"
                        class="form-input"
                        placeholder="••••••••"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn-submit"
                >
                    Donor Sign In
                </button>


                <div class="forgot-password">

                    <a href="../Forget-Password/forgot-password.html">
                        Forgot Password?
                    </a>

                </div>

            </form>




            <!-- =================================================
                 DONOR REGISTER
            ================================================== -->

            <form
                id="donor-register"
                onsubmit="handleAuth(event, 'Donor Registration')"
                class="hidden"
            >

                <div class="portal-title">
                    Donor Registration
                </div>


                <div class="form-group">

                    <label for="donorName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="donorName"
                        class="form-input"
                        placeholder="John Doe"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="donorEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="donorEmail"
                        class="form-input"
                        placeholder="donor@example.com"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="donorPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="donorPassword"
                        class="form-input"
                        placeholder="••••••••"
                        required
                    >

                </div>


                <div class="form-group grid-2">

                    <div>

                        <label for="bloodGroup">
                            Blood Group
                        </label>

                        <select
                            id="bloodGroup"
                            class="form-select"
                            required
                        >

                            <option value="">
                                Select
                            </option>

                            <option>A+</option>
                            <option>A-</option>
                            <option>B+</option>
                            <option>B-</option>
                            <option>O+</option>
                            <option>O-</option>
                            <option>AB+</option>
                            <option>AB-</option>

                        </select>

                    </div>


                    <div>

                        <label for="district">
                            District
                        </label>

                        <input
                            type="text"
                            id="district"
                            class="form-input"
                            placeholder="Colombo"
                            required
                        >

                    </div>

                </div>


                <button
                    type="submit"
                    class="btn-submit"
                >
                    Create Donor Account
                </button>

            </form>




            <!-- =================================================
                 HOSPITAL STAFF LOGIN
            ================================================== -->

            <form
                id="staff-login"
                onsubmit="handleAuth(event, 'Hospital Staff Login')"
                class="hidden"
            >

                <div class="portal-title">
                    Hospital Staff Login
                </div>


                <div class="form-group">

                    <label for="staffLoginEmail">
                        Staff Email
                    </label>

                    <input
                        type="email"
                        id="staffLoginEmail"
                        class="form-input"
                        placeholder="staff@hospital.com"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="staffLoginPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="staffLoginPassword"
                        class="form-input"
                        placeholder="••••••••"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn-submit"
                >
                    Staff Sign In
                </button>


                <div class="forgot-password">

                    <a href="../Forget-Password/forgot-password.html">
                        Forgot Password?
                    </a>

                </div>

            </form>




            <!-- =================================================
                 HOSPITAL STAFF REGISTER
            ================================================== -->

            <form
                id="staff-register"
                onsubmit="handleAuth(event, 'Hospital Staff Registration')"
                class="hidden"
            >

                <div class="portal-title">
                    Hospital Staff Registration
                </div>


                <div class="form-group">

                    <label for="staffName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="staffName"
                        class="form-input"
                        placeholder="John Doe"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="staffEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="staffEmail"
                        class="form-input"
                        placeholder="staff@hospital.com"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="staffPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="staffPassword"
                        class="form-input"
                        placeholder="••••••••"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="hospitalName">
                        Hospital / Clinic Name
                    </label>

                    <input
                        type="text"
                        id="hospitalName"
                        class="form-input"
                        placeholder="National Hospital Colombo"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="employeeId">
                        Employee / Staff ID
                    </label>

                    <input
                        type="text"
                        id="employeeId"
                        class="form-input"
                        placeholder="EMP-10023"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn-submit"
                >
                    Create Staff Account
                </button>

            </form>


        </div>

    </div>



    <!-- ======================================================
         JAVASCRIPT
    ======================================================= -->

    <script>

        let currentMode = "donor";

        let currentAuth = "login";


        /* ==================================================
           CHANGE DONOR / STAFF MODE
        ================================================== */

        function setMode(mode) {

            currentMode = mode;


            const donorBtn =
                document.getElementById("mode-donor-btn");

            const staffBtn =
                document.getElementById("mode-staff-btn");


            if (mode === "donor") {

                donorBtn.className =
                    "btn-mode active";

                staffBtn.className =
                    "btn-mode inactive";

            }
            else {

                staffBtn.className =
                    "btn-mode active";

                donorBtn.className =
                    "btn-mode inactive";

            }


            updateForm();

        }



        /* ==================================================
           LOGIN / REGISTER TAB
        ================================================== */

        function switchAuthTab(tab) {

            currentAuth = tab;


            const loginTab =
                document.getElementById("tab-login");

            const registerTab =
                document.getElementById("tab-register");


            if (tab === "login") {

                loginTab.className =
                    "tab-btn active";

                registerTab.className =
                    "tab-btn inactive";

            }
            else {

                registerTab.className =
                    "tab-btn active";

                loginTab.className =
                    "tab-btn inactive";

            }


            updateForm();

        }



        /* ==================================================
           DISPLAY CORRECT FORM
        ================================================== */

        function updateForm() {

            const forms = [

                "donor-login",

                "donor-register",

                "staff-login",

                "staff-register"

            ];


            // Hide every form

            forms.forEach(function(formId) {

                document
                    .getElementById(formId)
                    .classList.add("hidden");

            });


            // Show selected form

            let selectedForm;


            if (
                currentMode === "donor" &&
                currentAuth === "login"
            ) {

                selectedForm =
                    "donor-login";

            }


            else if (
                currentMode === "donor" &&
                currentAuth === "register"
            ) {

                selectedForm =
                    "donor-register";

            }


            else if (
                currentMode === "staff" &&
                currentAuth === "login"
            ) {

                selectedForm =
                    "staff-login";

            }


            else {

                selectedForm =
                    "staff-register";

            }


            document
                .getElementById(selectedForm)
                .classList.remove("hidden");

        }



        /* ==================================================
           FORM SUBMISSION
        ================================================== */

        function handleAuth(event, type) {

            event.preventDefault();


            alert(
                type +
                " submitted successfully."
            );

        }

    </script>

</body>

</html>
