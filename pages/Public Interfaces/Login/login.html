<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Blood Donation System - Portal</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <div class="auth-card">


        <!-- ==================================================
             HEADER
        =================================================== -->

        <div class="card-header">

            <h3>
                COMMUNITY BLOOD DONATION NETWORK
            </h3>

            <div class="logo">
                <img src="../../assets/images/logo.png"
                    height="120"
                    alt="Community Blood Donation Network Logo"
                >
            </div>

        </div>



        <!-- ==================================================
             PORTAL MODE
        =================================================== -->

        <div class="mode-toggle-container">

            <div class="mode-grid">

                <button
                    type="button"
                    id="mode-donor-btn"
                    onclick="setMode('donor')"
                    class="btn-mode active"
                >
                    Donor
                </button>


                <button
                    type="button"
                    id="mode-staff-btn"
                    onclick="setMode('staff')"
                    class="btn-mode inactive"
                >
                    Hospital Staff
                </button>

            </div>

        </div>



        <!-- ==================================================
             AUTH TABS
        =================================================== -->

        <div class="auth-tabs">

            <button
                type="button"
                id="tab-login"
                onclick="switchAuthTab('login')"
                class="tab-btn active"
            >
                Login
            </button>


            <button
                type="button"
                id="tab-register"
                onclick="switchAuthTab('register')"
                class="tab-btn inactive"
            >
                Register
            </button>

        </div>



        <!-- ==================================================
             FORMS
        =================================================== -->

        <div class="form-container">


            <!-- =================================================
                 DONOR LOGIN
            ================================================== -->

            <form
                id="donor-login"
                onsubmit="loginDonor(event)"
            >

                <div class="portal-title">
                    Donor Login
                </div>


                <div class="form-group">

                    <label for="donorLoginEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="donorLoginEmail"
                        class="form-input"
                        placeholder="donor@example.com"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="donorLoginPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="donorLoginPassword"
                        class="form-input"
                        placeholder="••••••••"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn-submit"
                >
                    Donor Sign In
                </button>


                <div class="forgot-password">

                    <a href="../Forget-Password/forgot-password.html">
                        Forgot Password?
                    </a>

                </div>

            </form>




            <!-- =================================================
                 DONOR REGISTER
            ================================================== -->

            <form
                id="donor-register"
                onsubmit="registerDonor(event)"
                class="hidden"
            >

                <div class="portal-title">
                    Donor Registration
                </div>


                <div class="form-group">

                    <label for="donorName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="donorName"
                        class="form-input"
                        placeholder="John Doe"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="donorEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="donorEmail"
                        class="form-input"
                        placeholder="donor@example.com"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="donorPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="donorPassword"
                        class="form-input"
                        placeholder="••••••••"
                        minlength="6"
                        required
                    >

                </div>


                <div class="form-group grid-2">

                    <div>

                        <label for="bloodGroup">
                            Blood Group
                        </label>

                        <select
                            id="bloodGroup"
                            class="form-select"
                            required
                        >

                            <option value="">
                                Select
                            </option>

                            <option value="A+">A+</option>
                            <option value="A-">A-</option>
                            <option value="B+">B+</option>
                            <option value="B-">B-</option>
                            <option value="O+">O+</option>
                            <option value="O-">O-</option>
                            <option value="AB+">AB+</option>
                            <option value="AB-">AB-</option>

                        </select>

                    </div>


                    <div>

                        <label for="district">
                            District
                        </label>

                        <input
                            type="text"
                            id="district"
                            class="form-input"
                            placeholder="Colombo"
                            required
                        >

                    </div>

                </div>


                <button
                    type="submit"
                    class="btn-submit"
                >
                    Create Donor Account
                </button>

            </form>




            <!-- =================================================
                 HOSPITAL STAFF LOGIN
            ================================================== -->

            <form
                id="staff-login"
                onsubmit="loginStaff(event)"
                class="hidden"
            >

                <div class="portal-title">
                    Hospital Staff Login
                </div>


                <div class="form-group">

                    <label for="staffLoginEmail">
                        Staff Email
                    </label>

                    <input
                        type="email"
                        id="staffLoginEmail"
                        class="form-input"
                        placeholder="staff@hospital.com"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="staffLoginPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="staffLoginPassword"
                        class="form-input"
                        placeholder="••••••••"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn-submit"
                >
                    Staff Sign In
                </button>


                <div class="forgot-password">

                    <a href="../Forget-Password/forgot-password.html">
                        Forgot Password?
                    </a>

                </div>

            </form>




            <!-- =================================================
                 HOSPITAL STAFF REGISTER
            ================================================== -->

            <form
                id="staff-register"
                onsubmit="registerStaff(event)"
                class="hidden"
            >

                <div class="portal-title">
                    Hospital Staff Registration
                </div>


                <div class="form-group">

                    <label for="staffName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="staffName"
                        class="form-input"
                        placeholder="John Doe"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="staffEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="staffEmail"
                        class="form-input"
                        placeholder="staff@hospital.com"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="staffPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="staffPassword"
                        class="form-input"
                        placeholder="••••••••"
                        minlength="6"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="hospitalName">
                        Hospital / Clinic Name
                    </label>

                    <input
                        type="text"
                        id="hospitalName"
                        class="form-input"
                        placeholder="National Hospital Colombo"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="employeeId">
                        Employee / Staff ID
                    </label>

                    <input
                        type="text"
                        id="employeeId"
                        class="form-input"
                        placeholder="EMP-10023"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn-submit"
                >
                    Create Staff Account
                </button>

            </form>


        </div>

    </div>



    <!-- ======================================================
         SUPABASE JAVASCRIPT LIBRARY
    ======================================================= -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>



    <!-- ======================================================
         SUPABASE CONFIGURATION
    ======================================================= -->

    <script>

        const SUPABASE_URL =
            "https://ayrcawqhhgpmllwvkjjr.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_XNMDU8mTvE42rJ4LOwkKKA_tcTopl1-";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


    </script>



    <!-- ======================================================
         APPLICATION JAVASCRIPT
    ======================================================= -->

    <script>


        // ==================================================
        // CURRENT MODE
        // ==================================================

        let currentMode = "donor";

        let currentAuth = "login";



        // ==================================================
        // CHANGE DONOR / STAFF MODE
        // ==================================================

        function setMode(mode) {

            currentMode = mode;


            const donorBtn =
                document.getElementById(
                    "mode-donor-btn"
                );

            const staffBtn =
                document.getElementById(
                    "mode-staff-btn"
                );


            if (mode === "donor") {

                donorBtn.className =
                    "btn-mode active";

                staffBtn.className =
                    "btn-mode inactive";

            }

            else {

                staffBtn.className =
                    "btn-mode active";

                donorBtn.className =
                    "btn-mode inactive";

            }


            updateForm();

        }



        // ==================================================
        // LOGIN / REGISTER TAB
        // ==================================================

        function switchAuthTab(tab) {

            currentAuth = tab;


            const loginTab =
                document.getElementById(
                    "tab-login"
                );

            const registerTab =
                document.getElementById(
                    "tab-register"
                );


            if (tab === "login") {

                loginTab.className =
                    "tab-btn active";

                registerTab.className =
                    "tab-btn inactive";

            }

            else {

                registerTab.className =
                    "tab-btn active";

                loginTab.className =
                    "tab-btn inactive";

            }


            updateForm();

        }



        // ==================================================
        // DISPLAY CORRECT FORM
        // ==================================================

        function updateForm() {

            const forms = [

                "donor-login",
                "donor-register",
                "staff-login",
                "staff-register"

            ];


            // Hide all forms

            forms.forEach(function(formId) {

                document
                    .getElementById(formId)
                    .classList.add("hidden");

            });

 
            let selectedForm;


            if (
                currentMode === "donor" &&
                currentAuth === "login"
            ) {

                selectedForm =
                    "donor-login";

            }


            else if (
                currentMode === "donor" &&
                currentAuth === "register"
            ) {

                selectedForm =
                    "donor-register";

            }


            else if (
                currentMode === "staff" &&
                currentAuth === "login"
            ) {

                selectedForm =
                    "staff-login";

            }


            else {

                selectedForm =
                    "staff-register";

            }


            document
                .getElementById(selectedForm)
                .classList.remove("hidden");

        }



        // ==================================================
        // DONOR REGISTRATION
        // ==================================================

        async function registerDonor(event) {

            event.preventDefault();


            // Get form values

            const fullName =
                document
                    .getElementById("donorName")
                    .value
                    .trim();


            const email =
                document
                    .getElementById("donorEmail")
                    .value
                    .trim();


            const password =
                document
                    .getElementById("donorPassword")
                    .value;


            const bloodGroup =
                document
                    .getElementById("bloodGroup")
                    .value;


            const district =
                document
                    .getElementById("district")
                    .value
                    .trim();



            // Basic validation

            if (
                !fullName ||
                !email ||
                !password ||
                !bloodGroup ||
                !district
            ) {

                alert(
                    "Please fill in all required fields."
                );

                return;

            }



            try {


                // Create Supabase Auth account

                const {
                    data,
                    error
                } =
                    await supabaseClient.auth.signUp({

                        email: email,

                        password: password,

                        options: {
                            data: {
                                account_type: "donor",
                                full_name: fullName,
                                blood_group: bloodGroup,
                                district: district
                            }
                        }

                    });



                if (error) {

                    console.error(
                        "Registration error:",
                        error
                    );

                    alert(
                        "Registration failed: " +
                        error.message
                    );

                    return;

                }



                if (!data.user) {

                    alert(
                        "Account creation failed. Please try again."
                    );

                    return;

                }



                alert(
                    "Account created. Check your email, confirm your account, then log in."
                );


                switchAuthTab("login");


            }

            catch (error) {

                console.error(
                    "Unexpected error:",
                    error
                );

                alert(
                    "Something went wrong. Please try again."
                );

            }

        }



        // ==================================================
        // DONOR LOGIN
        // ==================================================

        async function hasRegisteredProfile(tableName, userId) {

            const {
                data,
                error
            } =
                await supabaseClient
                    .from(tableName)
                    .select("id")
                    .eq("id", userId)
                    .maybeSingle();


            if (error) {

                console.error(
                    "Profile verification error:",
                    error
                );

                throw error;

            }


            return Boolean(data);

        }

        async function loginDonor(event) {

            event.preventDefault();


            const email =
                document
                    .getElementById(
                        "donorLoginEmail"
                    )
                    .value
                    .trim();


            const password =
                document
                    .getElementById(
                        "donorLoginPassword"
                    )
                    .value;



            if (!email || !password) {

                alert(
                    "Please enter your email and password."
                );

                return;

            }



            try {


                const {
                    data,
                    error
                } =
                    await supabaseClient.auth
                        .signInWithPassword({

                            email: email,

                            password: password

                        });



                if (error) {

                    console.error(
                        "Donor login error:",
                        error
                    );

                    alert(
                        "Login failed: " +
                        error.message
                    );

                    return;

                }



                if (!data.user) {

                    alert(
                        "Unable to log in."
                    );

                    return;

                }


                const isRegisteredDonor =
                    await hasRegisteredProfile(
                        "donor_profiles",
                        data.user.id
                    );


                if (!isRegisteredDonor) {

                    await supabaseClient.auth.signOut();

                    alert(
                        "This account is not registered as a donor. Please use Register first."
                    );

                    return;

                }



                alert(
                    "Donor login successful!"
                );



                window.location.href =
                    "../../Doner Interfaces/donor/donor-dashboard.html";


            }

            catch (error) {

                console.error(
                    "Unexpected login error:",
                    error
                );

                alert(
                    "Something went wrong. Please try again."
                );

            }

        }



        // ==================================================
        // STAFF REGISTRATION
        // ==================================================

        async function registerStaff(event) {

            event.preventDefault();


            const fullName =
                document
                    .getElementById("staffName")
                    .value
                    .trim();


            const email =
                document
                    .getElementById("staffEmail")
                    .value
                    .trim();


            const password =
                document
                    .getElementById("staffPassword")
                    .value;


            const hospitalName =
                document
                    .getElementById("hospitalName")
                    .value
                    .trim();


            const employeeId =
                document
                    .getElementById("employeeId")
                    .value
                    .trim();



            if (
                !fullName ||
                !email ||
                !password ||
                !hospitalName ||
                !employeeId
            ) {

                alert(
                    "Please fill in all required fields."
                );

                return;

            }



            try {


                // Create authentication account

                const {
                    data,
                    error
                } =
                    await supabaseClient.auth.signUp({

                        email: email,

                        password: password,

                        options: {
                            data: {
                                account_type: "staff",
                                full_name: fullName,
                                hospital_name: hospitalName,
                                employee_id: employeeId
                            }
                        }

                    });



                if (error) {

                    console.error(
                        "Staff registration error:",
                        error
                    );

                    alert(
                        "Registration failed: " +
                        error.message
                    );

                    return;

                }



                if (!data.user) {

                    alert(
                        "Staff account could not be created."
                    );

                    return;

                }



                alert(
                    "Account created. Check your email, confirm your account, then log in."
                );


                switchAuthTab("login");


            }

            catch (error) {

                console.error(
                    "Unexpected staff registration error:",
                    error
                );

                alert(
                    "Something went wrong. Please try again."
                );

            }

        }



        // ==================================================
        // STAFF LOGIN
        // ==================================================

        async function loginStaff(event) {

            event.preventDefault();


            const email =
                document
                    .getElementById(
                        "staffLoginEmail"
                    )
                    .value
                    .trim();


            const password =
                document
                    .getElementById(
                        "staffLoginPassword"
                    )
                    .value;



            if (!email || !password) {

                alert(
                    "Please enter your email and password."
                );

                return;

            }



            try {


                const {
                    data,
                    error
                } =
                    await supabaseClient.auth
                        .signInWithPassword({

                            email: email,

                            password: password

                        });



                if (error) {

                    console.error(
                        "Staff login error:",
                        error
                    );

                    alert(
                        "Login failed: " +
                        error.message
                    );

                    return;

                }



                if (!data.user) {

                    alert(
                        "Unable to log in."
                    );

                    return;

                }


                const isRegisteredStaff =
                    await hasRegisteredProfile(
                        "staff_profiles",
                        data.user.id
                    );


                if (!isRegisteredStaff) {

                    await supabaseClient.auth.signOut();

                    alert(
                        "This account is not registered as hospital staff. Please use Register first."
                    );

                    return;

                }



                alert(
                    "Hospital staff login successful!"
                );



                window.location.href =
                    "../../hospital/hospital-dashboard.html";


            }

            catch (error) {

                console.error(
                    "Unexpected staff login error:",
                    error
                );

                alert(
                    "Something went wrong. Please try again."
                );

            }

        }



        // ==================================================
        // INITIAL FORM
        // ==================================================

        updateForm();


    </script>


</body>

</html>
