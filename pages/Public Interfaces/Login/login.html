    <script>


        // ==================================================
        // CURRENT MODE
        // ==================================================

        let currentMode = "donor";

        let currentAuth = "login";



        // ==================================================
        // CHANGE DONOR / STAFF MODE
        // ==================================================

        function setMode(mode) {

            currentMode = mode;


            const donorBtn =
                document.getElementById(
                    "mode-donor-btn"
                );

            const staffBtn =
                document.getElementById(
                    "mode-staff-btn"
                );


            if (mode === "donor") {

                donorBtn.className =
                    "btn-mode active";

                staffBtn.className =
                    "btn-mode inactive";

            }

            else {

                staffBtn.className =
                    "btn-mode active";

                donorBtn.className =
                    "btn-mode inactive";

            }


            updateForm();

        }



        // ==================================================
        // LOGIN / REGISTER TAB
        // ==================================================

        function switchAuthTab(tab) {

            currentAuth = tab;


            const loginTab =
                document.getElementById(
                    "tab-login"
                );

            const registerTab =
                document.getElementById(
                    "tab-register"
                );


            if (tab === "login") {

                loginTab.className =
                    "tab-btn active";

                registerTab.className =
                    "tab-btn inactive";

            }

            else {

                registerTab.className =
                    "tab-btn active";

                loginTab.className =
                    "tab-btn inactive";

            }


            updateForm();

        }



        // ==================================================
        // DISPLAY CORRECT FORM
        // ==================================================

        function updateForm() {

            const forms = [

                "donor-login",
                "donor-register",
                "staff-login",
                "staff-register"

            ];


            forms.forEach(function(formId) {

                document
                    .getElementById(formId)
                    .classList.add("hidden");

            });


            let selectedForm;


            if (
                currentMode === "donor" &&
                currentAuth === "login"
            ) {

                selectedForm =
                    "donor-login";

            }

            else if (
                currentMode === "donor" &&
                currentAuth === "register"
            ) {

                selectedForm =
                    "donor-register";

            }

            else if (
                currentMode === "staff" &&
                currentAuth === "login"
            ) {

                selectedForm =
                    "staff-login";

            }

            else {

                selectedForm =
                    "staff-register";

            }


            document
                .getElementById(selectedForm)
                .classList.remove("hidden");

        }



        // ==================================================
        // SHOW LOADING STATE
        // ==================================================

        function setButtonLoading(button, loadingText) {

            if (!button) {
                return;
            }

            button.dataset.originalText =
                button.innerText;

            button.innerText =
                loadingText;

            button.disabled = true;

        }



        function restoreButton(button) {

            if (!button) {
                return;
            }

            button.innerText =
                button.dataset.originalText ||
                button.innerText;

            button.disabled = false;

        }



        // ==================================================
        // GET PROFILE
        // ==================================================

        async function getProfile(tableName, userId) {

            const {
                data,
                error
            } =
                await supabaseClient
                    .from(tableName)
                    .select("*")
                    .eq("id", userId)
                    .maybeSingle();


            if (error) {

                console.error(
                    `${tableName} lookup error:`,
                    error
                );

                throw error;

            }


            return data;

        }



        // ==================================================
        // CHECK PROFILE
        // ==================================================

        async function hasRegisteredProfile(
            tableName,
            userId
        ) {

            const profile =
                await getProfile(
                    tableName,
                    userId
                );


            return Boolean(profile);

        }



        // ==================================================
        // CREATE / REPAIR DONOR PROFILE
        // ==================================================

        async function ensureDonorProfile(user) {

            console.log(
                "Checking donor profile for:",
                user.id
            );


            // ------------------------------------------------
            // STEP 1
            // Check whether profile already exists
            // ------------------------------------------------

            const existingProfile =
                await getProfile(
                    "donor_profiles",
                    user.id
                );


            if (existingProfile) {

                console.log(
                    "Existing donor profile found."
                );

                return true;

            }



            // ------------------------------------------------
            // STEP 2
            // Get metadata from Auth user
            // ------------------------------------------------

            const metadata =
                user.user_metadata || {};


            console.log(
                "User metadata:",
                metadata
            );


            const cityValue =
                metadata.city || metadata.district || "";


            const phoneValue =
                metadata.phone || "";

            const dobValue =
                metadata.dob || "";

            const genderValue =
                metadata.gender || "";

            const addressValue =
                metadata.address || "";

            const lastDonationValue =
                metadata.last_donation || "";


            // ------------------------------------------------
            // STEP 3
            // Make sure this is actually a donor
            // ------------------------------------------------

            if (
                metadata.account_type &&
                metadata.account_type !== "donor"
            ) {

                console.error(
                    "This Auth account belongs to another account type."
                );

                return false;

            }



            // ------------------------------------------------
            // STEP 4
            // Required donor data
            // ------------------------------------------------

            const fullName =
                metadata.full_name || "";

            const bloodGroup =
                metadata.blood_group || "";

            const cityFromMetadata =
                metadata.city || metadata.district || "";


            if (
                !fullName ||
                !bloodGroup ||
                !cityFromMetadata
            ) {

                console.error(
                    "Donor profile metadata is incomplete.",
                    metadata
                );

                return false;

            }



            // ------------------------------------------------
            // STEP 5
            // Try creating missing profile
            // ------------------------------------------------

            const {
                error
            } =
                await supabaseClient
                    .from("donor_profiles")
                    .insert({

                        id: user.id,

                        full_name: fullName,

                        email: user.email,

                        phone: phoneValue,

                        blood_group: bloodGroup,

                        dob: dobValue,

                        gender: genderValue,

                        city: cityFromMetadata,

                        address: addressValue,

                        last_donation: lastDonationValue

                    });


            // ------------------------------------------------
            // Duplicate means another process already created
            // it, so continue.
            // ------------------------------------------------

            if (
                error &&
                error.code !== "23505"
            ) {

                console.error(
                    "Donor profile creation failed:",
                    error
                );

                throw error;

            }



            // ------------------------------------------------
            // STEP 6
            // Verify profile again
            // ------------------------------------------------

            const repairedProfile =
                await getProfile(
                    "donor_profiles",
                    user.id
                );


            if (repairedProfile) {

                console.log(
                    "Donor profile successfully verified."
                );

                return true;

            }


            return false;

        }



        // ==================================================
        // CREATE / REPAIR STAFF PROFILE
        // ==================================================

        async function ensureStaffProfile(user) {

            console.log(
                "Checking staff profile for:",
                user.id
            );


            // ------------------------------------------------
            // STEP 1
            // Check existing profile
            // ------------------------------------------------

            const existingProfile =
                await getProfile(
                    "staff_profiles",
                    user.id
                );


            if (existingProfile) {

                console.log(
                    "Existing staff profile found."
                );

                return true;

            }



            // ------------------------------------------------
            // STEP 2
            // Read Auth metadata
            // ------------------------------------------------

            const metadata =
                user.user_metadata || {};


            console.log(
                "Staff metadata:",
                metadata
            );


            // ------------------------------------------------
            // STEP 3
            // Verify account type
            // ------------------------------------------------

            if (
                metadata.account_type &&
                metadata.account_type !== "staff"
            ) {

                console.error(
                    "This Auth account belongs to another account type."
                );

                return false;

            }



            // ------------------------------------------------
            // STEP 4
            // Required information
            // ------------------------------------------------

            const hospitalName =
                metadata.hospital_name || "";

            const employeeId =
                metadata.employee_id || metadata.registration_number || "";

            const hospitalPhone =
                metadata.phone || "";

            const hospitalLocation =
                metadata.location || "";

            const hospitalType =
                metadata.hospital_type || "General Hospital";

            const hospitalAddress =
                metadata.address || "";

            const bloodBankStatus =
                metadata.blood_bank || "Available";

            const emergencyContact =
                metadata.emergency_contact || "";


            if (
                !hospitalName ||
                !employeeId
            ) {

                console.error(
                    "Staff profile metadata is incomplete.",
                    metadata
                );

                return false;

            }



            // ------------------------------------------------
            // STEP 5
            // Create missing profile
            // ------------------------------------------------

            const {
                error
            } =
                await supabaseClient
                    .from("staff_profiles")
                    .insert({

                        id: user.id,

                        hospital_name: hospitalName,

                        email: user.email,

                        phone: hospitalPhone,

                        location: hospitalLocation,

                        registration_number: employeeId,

                        hospital_type: hospitalType,

                        address: hospitalAddress,

                        blood_bank: bloodBankStatus,

                        emergency_contact: emergencyContact

                    });


            if (
                error &&
                error.code !== "23505"
            ) {

                console.error(
                    "Staff profile creation failed:",
                    error
                );

                throw error;

            }



            // ------------------------------------------------
            // STEP 6
            // Verify again
            // ------------------------------------------------

            const repairedProfile =
                await getProfile(
                    "staff_profiles",
                    user.id
                );


            if (repairedProfile) {

                console.log(
                    "Staff profile successfully verified."
                );

                return true;

            }


            return false;

        }



        // ==================================================
        // DONOR REGISTRATION
        // ==================================================

        async function registerDonor(event) {

            event.preventDefault();


            const button =
                event.target.querySelector(
                    "button[type='submit']"
                );


            setButtonLoading(
                button,
                "Creating Account..."
            );



            // ------------------------------------------------
            // Get values
            // ------------------------------------------------

            const fullName =
                document
                    .getElementById("donorName")
                    .value
                    .trim();


            const email =
                document
                    .getElementById("donorEmail")
                    .value
                    .trim()
                    .toLowerCase();


            const password =
                document
                    .getElementById("donorPassword")
                    .value;


            const phone =
                document
                    .getElementById("donorPhone")
                    .value
                    .trim();


            const bloodGroup =
                document
                    .getElementById("bloodGroup")
                    .value;


            const dob =
                document
                    .getElementById("donorDob")
                    .value;


            const gender =
                document
                    .getElementById("donorGender")
                    .value;


            const city =
                document
                    .getElementById("donorCity")
                    .value
                    .trim();


            const address =
                document
                    .getElementById("donorAddress")
                    .value
                    .trim();


            const lastDonation =
                document
                    .getElementById("donorLastDonation")
                    .value;



            // ------------------------------------------------
            // Validation
            // ------------------------------------------------

            if (
                !fullName ||
                !email ||
                !password ||
                !bloodGroup
            ) {

                restoreButton(button);

                alert(
                    "Please fill in all required fields."
                );

                return;

            }



            if (password.length < 6) {

                restoreButton(button);

                alert(
                    "Password must contain at least 6 characters."
                );

                return;

            }



            try {

                console.log(
                    "Starting donor registration..."
                );


                // ------------------------------------------------
                // Create Supabase Auth account
                // ------------------------------------------------

                const {
                    data,
                    error
                } =
                    await supabaseClient.auth.signUp({

                        email: email,

                        password: password,

                        options: {

                            data: {

                                account_type:
                                    "donor",

                                full_name:
                                    fullName,

                                email:
                                    email,

                                phone:
                                    phone,

                                blood_group:
                                    bloodGroup,

                                dob:
                                    dob,

                                gender:
                                    gender,

                                city:
                                    city,

                                address:
                                    address,

                                last_donation:
                                    lastDonation

                            }

                        }

                    });



                if (error) {

                    console.error(
                        "Donor registration error:",
                        error
                    );


                    // More useful message for already-existing
                    // accounts.

                    const message =
                        error.message || "";


                    if (
                        message
                            .toLowerCase()
                            .includes("already")
                    ) {

                        alert(
                            "This email is already registered in Supabase. Please use the Login tab instead."
                        );

                    }

                    else {

                        alert(
                            "Registration failed: " +
                            message
                        );

                    }


                    restoreButton(button);

                    return;

                }



                if (!data || !data.user) {

                    restoreButton(button);

                    alert(
                        "Account could not be created. Please try again."
                    );

                    return;

                }



                console.log(
                    "Donor Auth account created:",
                    data.user.id
                );



                // ------------------------------------------------
                // IMPORTANT
                //
                // If email confirmation is disabled, a session
                // may already exist and we can create the profile
                // immediately.
                //
                // If email confirmation is enabled, the database
                // trigger should create the profile.
                // ------------------------------------------------

                if (data.session) {

                    try {

                        await ensureDonorProfile(
                            data.user
                        );

                    }

                    catch (profileError) {

                        console.error(
                            "Profile creation after registration failed:",
                            profileError
                        );

                    }

                }



                restoreButton(button);


                if (data.session) {

                    alert(
                        "Donor account created successfully. You can now log in."
                    );

                }

                else {

                    alert(
                        "Donor account created successfully. Please check your email and confirm your account before logging in."
                    );

                }


                // Go to login

                switchAuthTab("login");


                // Clear password

                document
                    .getElementById(
                        "donorPassword"
                    )
                    .value = "";


            }

            catch (error) {

                console.error(
                    "Unexpected donor registration error:",
                    error
                );


                restoreButton(button);


                alert(
                    "Something went wrong during registration.\n\n" +
                    (
                        error.message ||
                        "Please try again."
                    )
                );

            }

        }

        // ==================================================
        // STAFF REGISTRATION
        // ==================================================

        async function registerStaff(event) {

            event.preventDefault();


            const button =
                event.target.querySelector(
                    "button[type='submit']"
                );


            setButtonLoading(
                button,
                "Creating Account..."
            );



            const email =
                document
                    .getElementById("staffEmail")
                    .value
                    .trim()
                    .toLowerCase();


            const password =
                document
                    .getElementById("staffPassword")
                    .value;


            const hospitalName =
                document
                    .getElementById("hospitalName")
                    .value
                    .trim();


            const employeeId =
                document
                    .getElementById("employeeId")
                    .value
                    .trim();


            const hospitalPhone =
                document
                    .getElementById("hospitalPhone")
                    .value
                    .trim();


            const hospitalLocation =
                document
                    .getElementById("hospitalLocation")
                    .value
                    .trim();


            const hospitalType =
                document
                    .getElementById("hospitalType")
                    .value;


            const hospitalAddress =
                document
                    .getElementById("hospitalAddress")
                    .value
                    .trim();


            const bloodBankStatus =
                document
                    .getElementById("bloodBankStatus")
                    .value;


            const emergencyContact =
                document
                    .getElementById("emergencyContact")
                    .value
                    .trim();



            // ------------------------------------------------
            // Validation
            // ------------------------------------------------

            if (
                !email ||
                !password ||
                !hospitalName ||
                !employeeId ||
                !hospitalPhone ||
                !hospitalLocation ||
                !hospitalAddress ||
                !emergencyContact
            ) {

                restoreButton(button);

                alert(
                    "Please fill in all required fields."
                );

                return;

            }



            if (password.length < 6) {

                restoreButton(button);

                alert(
                    "Password must contain at least 6 characters."
                );

                return;

            }



            try {

                console.log(
                    "Starting staff registration..."
                );


                // ------------------------------------------------
                // Create Auth account
                // ------------------------------------------------

                const {
                    data,
                    error
                } =
                    await supabaseClient.auth.signUp({

                        email: email,

                        password: password,

                        options: {

                            data: {

                                account_type:
                                    "staff",

                                hospital_name:
                                    hospitalName,

                                email:
                                    email,

                                phone:
                                    hospitalPhone,

                                location:
                                    hospitalLocation,

                                registration_number:
                                    employeeId,

                                hospital_type:
                                    hospitalType,

                                address:
                                    hospitalAddress,

                                blood_bank:
                                    bloodBankStatus,

                                emergency_contact:
                                    emergencyContact

                            }

                        }

                    });



                if (error) {

                    console.error(
                        "Staff registration error:",
                        error
                    );


                    const message =
                        error.message || "";


                    if (
                        message
                            .toLowerCase()
                            .includes("already")
                    ) {

                        alert(
                            "This email is already registered in Supabase. Please use the Login tab instead."
                        );

                    }

                    else {

                        alert(
                            "Registration failed: " +
                            message
                        );

                    }


                    restoreButton(button);

                    return;

                }



                if (!data || !data.user) {

                    restoreButton(button);

                    alert(
                        "Staff account could not be created."
                    );

                    return;

                }



                console.log(
                    "Staff Auth account created:",
                    data.user.id
                );



                // ------------------------------------------------
                // Create profile immediately when a session
                // exists.
                // ------------------------------------------------

                if (data.session) {

                    try {

                        await ensureStaffProfile(
                            data.user
                        );

                    }

                    catch (profileError) {

                        console.error(
                            "Staff profile creation failed:",
                            profileError
                        );

                    }

                }



                restoreButton(button);


                if (data.session) {

                    alert(
                        "Hospital staff account created successfully. You can now log in."
                    );

                }

                else {

                    alert(
                        "Hospital staff account created successfully. Please check your email and confirm your account before logging in."
                    );

                }


                switchAuthTab("login");


                document
                    .getElementById(
                        "staffPassword"
                    )
                    .value = "";

            }

            catch (error) {

                console.error(
                    "Unexpected staff registration error:",
                    error
                );


                restoreButton(button);


                alert(
                    "Something went wrong during registration.\n\n" +
                    (
                        error.message ||
                        "Please try again."
                    )
                );

            }

        }
